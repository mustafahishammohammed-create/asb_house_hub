name: ASB House Hub CI

on:
  push:
    branches: [ main, master, mustafa1 ]
  pull_request:
    branches: [ main, master, mustafa1 ]

jobs:
  flutter_checks:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter compact

  firebase_emulator_checks:
    name: Cloud Functions & Firestore Rules Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm --prefix functions ci
      - run: npm --prefix functions run check
      - run: npx --yes firebase-tools emulators:exec --project demo-asb-audit --config firebase.audit.json --only firestore,storage "node --test functions/test/security.test.js"
